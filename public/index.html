<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fork · Pedidos, cocina y entrega para tu local</title>
<meta name="description" content="Fork: pedidos, cocina y entrega para locales gastronómicos, en las pantallas que ya tenés. Gratis, sin mail ni contraseña.">
<meta name="theme-color" content="#0f0d0b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<style>
:root{--fT:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ac:#ff6a1a;--ac2:#ff6a1a22;--bg:#0f0d0b;--pn:#1a1714;--pn2:#24201c;--pn3:#2f2a24;--tx:#f4efe9;--mu:#a39a90;--ok:#2fbf71;--wa:#f5b031;--bad:#ef4b4b;--info:#4aa8ff;--bd:#352f29;--r:14px;--sh:0 10px 30px #0006}
body.claro{--bg:#faf6f1;--pn:#fff;--pn2:#f4eee6;--pn3:#ebe3d8;--tx:#1f1913;--mu:#776c61;--bd:#e6dccf;--sh:0 10px 30px #3a2a1a1f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ac)}
.n{font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}
h1,.tit,.big,.nm,.num,.h2,.pared .nn,.stat b,.sec h3,.tk header .nm{font-family:var(--fT)}
.ops{display:block;font-size:.85em;color:var(--mu);font-weight:500}
.opg{margin-top:16px;padding-top:12px;border-top:1px solid var(--bd)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:99px;border:1.5px solid var(--bd);background:var(--pn2);font-weight:650;min-height:40px}
.chips button.on{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.chips button.off{opacity:.55;text-decoration:line-through;border-color:var(--bad);color:var(--bad)}
.chips button[disabled]{opacity:.35;text-decoration:line-through}
.sur{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.mod.kiosco>.bx{max-width:760px;font-size:1.15em}
.prodbar{display:flex;gap:10px;flex-wrap:wrap;padding:12px 12px 0;align-items:stretch}
.prodbar .g{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.prodbar .g b{font-size:.72em;text-transform:uppercase;color:var(--mu);letter-spacing:.06em;width:100%}
.prodbar .g span{font-weight:700;white-space:nowrap}
.prodbar .g span i{font-style:normal;color:var(--ac);font-size:1.3em;font-weight:900;margin-right:4px}
.prodbar .tg{font-weight:800;color:var(--tx);align-items:center}
.tk .ii .op{display:block;margin-top:3px;font-weight:650;color:var(--info);font-size:.92em}
.tk .ii .op em{font-style:normal;color:var(--mu);font-weight:600;font-size:.85em;text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.sm{font-size:.85em}
.xs{font-size:.75em}
.b{font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.row.w{flex-wrap:wrap}
.sp{flex:1}
.col{display:flex;flex-direction:column;gap:10px}
.hide{display:none!important}

/* Botones */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;background:var(--pn3);font-weight:650;min-height:44px;transition:transform .08s,filter .15s;white-space:nowrap;text-decoration:none;color:var(--tx)}
.bt:active{transform:scale(.97)}
.bt:hover{filter:brightness(1.12)}
.bt.ac{background:var(--ac);color:#fff}
.bt.ok{background:var(--ok);color:#fff}
.bt.bad{background:var(--bad);color:#fff}
.bt.wa{background:var(--wa);color:#211}
.bt.gh{background:transparent;border:1px solid var(--bd)}
.bt.sm{min-height:34px;padding:6px 11px;font-size:.88em;border-radius:9px}
.bt.xl{min-height:60px;font-size:1.15em;padding:14px 22px;border-radius:14px}
.bt[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--pn3);font-size:.82em;font-weight:650;white-space:nowrap}
.chip.ok{background:#2fbf7126;color:var(--ok)}
.chip.wa{background:#f5b03126;color:var(--wa)}
.chip.bad{background:#ef4b4b26;color:var(--bad)}
.chip.info{background:#4aa8ff26;color:var(--info)}
.chip.ac{background:var(--ac2);color:var(--ac)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu);display:inline-block}
.dot.ok{background:var(--ok)}.dot.wa{background:var(--wa)}.dot.bad{background:var(--bad)}

/* Formularios */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88em;color:var(--mu);font-weight:600}
.in{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--pn2);color:var(--tx);min-height:44px;outline:none}
.in:focus{border-color:var(--ac)}
textarea.in{min-height:70px;resize:vertical}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.sw input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--pn3);position:relative;transition:.2s;flex:none;border:1px solid var(--bd)}
.sw input:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.sw input:checked{background:var(--ok)}
.sw input:checked:after{left:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

/* Paneles */
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.card{background:var(--pn);border-radius:var(--r);border:1px solid var(--bd)}
.tit{font-size:1.25em;font-weight:800;letter-spacing:-.01em}
.h2{font-size:1.05em;font-weight:800;margin-bottom:8px}

/* Barra superior del personal */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;min-height:58px}
.top .lg{font-size:1.5em}
.top .nm{font-weight:800;line-height:1.1}
.top .pt{font-size:.78em;color:var(--mu);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.top .rel{font-weight:800;font-size:1.15em}
.con{display:inline-flex;align-items:center;gap:6px;font-size:.8em;color:var(--mu);font-weight:600}

/* Modal y aviso */
.mod{position:fixed;inset:0;background:#000a;z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.mod>.bx{background:var(--pn);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px;box-shadow:var(--sh);animation:su .2s}
.mod.ancho>.bx{max-width:980px}
@media(min-width:700px){.mod{align-items:center}.mod>.bx{border-radius:20px}}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(30px);opacity:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#111;color:#fff;padding:11px 18px;border-radius:12px;box-shadow:var(--sh);font-weight:600;animation:su .2s;max-width:90vw;text-align:center}
#toast div.bad{background:var(--bad)}
#toast div.ok{background:var(--ok)}

/* Inicio */
.home{max-width:980px;margin:0 auto;padding:28px 18px 60px}
.home .hero{padding:40px 0 30px}
.home .hero h1{font-size:clamp(2.4em,7vw,4.2em);line-height:1;font-weight:900;letter-spacing:-.04em}
.home .hero h1 span{color:var(--ac)}
.home .hero p{font-size:1.15em;color:var(--mu);margin-top:14px;max-width:620px}
.home .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:10px}
.home .card{padding:20px}
.pnt{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pnt a{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r);background:var(--pn);border:1px solid var(--bd);text-decoration:none;color:var(--tx);transition:.15s}
.pnt a:hover{border-color:var(--ac);transform:translateY(-2px)}
.pnt a b{font-size:1.1em}
.pnt a .ic{font-size:1.8em}

/* Landing / menú QR */
.lnd{max-width:720px;margin:0 auto;padding-bottom:110px}
.hero2{background:linear-gradient(160deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));color:#fff;padding:34px 20px 26px;border-radius:0 0 26px 26px}
.hero2 .em{font-size:3em;line-height:1}
.hero2 img.logo{width:76px;height:76px;border-radius:18px;object-fit:cover;background:#fff}
.hero2 h1{font-size:2.1em;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin-top:10px}
.hero2 .chip{background:#ffffff26;color:#fff}
.cats{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{padding:8px 14px;border-radius:99px;background:var(--pn2);font-weight:650;white-space:nowrap;font-size:.92em}
.cats button.on{background:var(--tx);color:var(--bg)}
.sec{padding:6px 16px}
.sec h3{font-size:1.2em;font-weight:850;margin:16px 0 8px}
.it{display:flex;gap:14px;padding:14px;background:var(--pn);border-radius:16px;margin-bottom:10px;border:1px solid var(--bd);align-items:center}
.it .em{font-size:2.3em;width:64px;height:64px;display:grid;place-items:center;background:var(--pn2);border-radius:14px;flex:none;overflow:hidden}
.it .em img{width:100%;height:100%;object-fit:cover}
.it .ds{font-size:.86em;color:var(--mu);margin-top:2px}
.it .pr{font-weight:800;margin-top:6px}
.it.ago{opacity:.45}
.stp{display:flex;align-items:center;gap:2px;background:var(--pn2);border-radius:99px;padding:3px}
.stp button{width:34px;height:34px;border-radius:50%;font-size:1.2em;font-weight:800;display:grid;place-items:center}
.stp button.mas{background:var(--ac);color:#fff}
.stp b{min-width:22px;text-align:center}
.barra{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:30;display:flex;justify-content:center}
.barra .bt{width:100%;max-width:690px;justify-content:space-between}
.aviso{margin:14px 16px 0;padding:14px;border-radius:14px;background:#f5b03122;color:var(--tx);border:1px solid #f5b03155;font-weight:600}
.mesa-bn{margin:14px 16px 0;padding:14px;border-radius:16px;background:var(--pn);border:1px solid var(--bd)}

/* Seguimiento */
.seg{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.seg .num{font-size:4.4em;font-weight:900;letter-spacing:-.04em;line-height:1;color:var(--ac)}
.prog{display:flex;gap:6px;margin:18px 0 6px}
.prog i{flex:1;height:8px;border-radius:99px;background:var(--pn3)}
.prog i.on{background:var(--ac)}
.prog i.ok{background:var(--ok)}
.copiar{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--pn2);margin-top:8px}
.copiar code{font-size:1.05em;font-weight:700;flex:1;word-break:break-all}

/* Pared (TV vertical) */
.pared{height:100vh;display:flex;flex-direction:column;background:var(--bg);color:#fff;overflow:hidden}
.pared header{display:flex;align-items:center;gap:2vmin;padding:3vmin 4vmin;background:var(--ac)}
.pared header .em{font-size:7vmin}
.pared header h1{font-size:5.6vmin;font-weight:900;letter-spacing:-.03em;line-height:1}
.pared header .rel{margin-left:auto;font-size:5vmin;font-weight:800}
.pared .cols{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.pared .cl{display:flex;flex-direction:column;min-height:0;padding:3vmin}
.pared .cl+.cl{background:#14301f}
.pared .cl h2{font-size:3.6vmin;text-transform:uppercase;letter-spacing:.08em;font-weight:900;opacity:.85;margin-bottom:2vmin}
.pared .ns{display:grid;grid-template-columns:1fr;gap:1.6vmin;align-content:start;overflow:hidden}
.pared .nn{font-size:11vmin;font-weight:900;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:1.5vmin}
.pared .nn small{font-size:3vmin;font-weight:700;opacity:.7}
.pared .cl:first-child .nn{color:#ffffffb3;font-size:8.5vmin}
.pared .cl+.cl .nn{color:#5ff29a}
.pared .nn.llama{animation:llama 1s infinite;color:#fff!important}
@keyframes llama{50%{color:var(--wa)!important;transform:scale(1.06)}}
.pared footer{display:flex;align-items:center;gap:3vmin;padding:2.5vmin 4vmin;background:var(--pn);font-size:3vmin}
.pared footer .qr{background:#fff;padding:1vmin;border-radius:1.5vmin;width:17vmin;height:17vmin;flex:none}
.pared footer .qr svg{width:100%;height:100%}
.pared .banner{position:absolute;left:0;right:0;top:35%;text-align:center;background:var(--wa);color:#1a1200;padding:4vmin;font-size:9vmin;font-weight:900;box-shadow:0 0 0 100vmax #000a;z-index:5}
.sonido{position:fixed;inset:0;z-index:50;background:#000c;display:grid;place-items:center;color:#fff;font-size:1.3em;font-weight:700;text-align:center;padding:20px;cursor:pointer}

/* Ventana cliente */
.vc{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.vc .gr{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:20px;padding:24px;min-height:0}
@media(orientation:portrait){.vc .gr{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.vc .big{font-size:clamp(2em,5vw,3.6em);font-weight:900;letter-spacing:-.03em;line-height:1.05}
.vc .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 10px;background:var(--pn);border:2px solid var(--bd);border-radius:18px;text-align:center;font-weight:700;min-height:140px}
.vc .tile .e{font-size:2.6em}
.vc .tile.on{border-color:var(--ac)}
.vc .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;overflow:auto;align-content:start;padding-bottom:20px}
.vc .listos{display:flex;flex-wrap:wrap;gap:10px}
.vc .listos b{font-size:2.2em;font-weight:900;color:var(--ok);background:#2fbf711a;padding:6px 16px;border-radius:14px}
.vc .qrb{background:#fff;border-radius:16px;padding:10px;width:180px;height:180px}
.vc .qrb svg{width:100%;height:100%}
.vc .toca{animation:lat 2s infinite}
@keyframes lat{50%{transform:scale(1.04)}}
.lin{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--bd);align-items:center}
.lin:last-child{border:0}

/* Personal: layouts */
.app{min-height:100vh;display:flex;flex-direction:column}
.cuerpo{flex:1;display:grid;gap:14px;padding:14px;min-height:0}
.caja{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr)}
.most{grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr)}
@media(max-width:900px){.caja,.most{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs button{padding:8px 13px;border-radius:10px;background:var(--pn2);font-weight:650;white-space:nowrap;font-size:.9em}
.tabs button.on{background:var(--ac);color:#fff}
.tabs button .c{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:#0005;margin-left:6px;font-size:.85em}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.prods button{background:var(--pn2);border:1px solid var(--bd);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:650;min-height:104px;text-align:center;position:relative}
.prods button .e{font-size:1.9em}
.prods button .q{position:absolute;top:6px;right:6px;background:var(--ac);color:#fff;border-radius:99px;min-width:24px;height:24px;font-size:.8em;display:grid;place-items:center}
.prods button:active{transform:scale(.96)}
.ped{background:var(--pn2);border-radius:12px;padding:12px;border:1px solid var(--bd);border-left:4px solid var(--mu)}
.ped.nuevo{border-left-color:var(--info)}.ped.prep{border-left-color:var(--wa)}.ped.listo{border-left-color:var(--ok)}.ped.encamino{border-left-color:var(--ac)}
.ped .nm{font-size:1.25em;font-weight:900}
.lista{display:flex;flex-direction:column;gap:10px;overflow:auto}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat div{background:var(--pn2);border-radius:12px;padding:8px 13px;min-width:100px}
.stat b{display:block;font-size:1.35em;font-weight:850}
.stat span{font-size:.75em;color:var(--mu);font-weight:650;text-transform:uppercase;letter-spacing:.04em}

/* Plano de mesas */
.plano{position:relative;width:100%;aspect-ratio:16/10;background:var(--pn2);border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:22px 22px;touch-action:none}
.mesa{position:absolute;width:12%;aspect-ratio:1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;background:var(--pn3);border:3px solid var(--bd);font-size:clamp(.9em,2vw,1.5em);transition:background .2s,border-color .2s;user-select:none}
.mesa small{font-size:.48em;font-weight:700;opacity:.85}
.mesa.ocupada{background:#2fbf7122;border-color:var(--ok)}
.mesa.esperando{background:#f5b03122;border-color:var(--wa)}
.mesa.cuenta{background:#ef4b4b22;border-color:var(--bad)}
.mesa.sel{outline:3px solid var(--tx);outline-offset:3px}
.mesa.llama:after{content:"🛎️";position:absolute;top:-12px;right:-12px;font-size:.9em;animation:lat 1s infinite}
.plano.edit .mesa{cursor:grab;border-style:dashed}
.ley{display:flex;gap:12px;flex-wrap:wrap;font-size:.8em;color:var(--mu);margin-top:8px}
.ley i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}

/* Cocina */
body.cocina{--bg:#0c0b0a}
.coc{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:12px;align-content:start}
.tk{background:var(--pn);border-radius:16px;overflow:hidden;border:2px solid var(--bd);display:flex;flex-direction:column}
.tk header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--pn3)}
.tk header .nm{font-size:1.6em;font-weight:900;letter-spacing:-.02em}
.tk header .t{margin-left:auto;font-size:1.3em;font-weight:850}
.tk.verde header{background:#1f4a32}.tk.amar header{background:#5a4314}.tk.rojo header{background:#6a1f1f}
.tk.rojo{border-color:var(--bad)}
.tk .its{padding:8px 14px;display:flex;flex-direction:column}
.tk .ii{padding:9px 0;border-bottom:1px solid var(--bd)}
.tk .ii:last-child{border:0}
.tk .ii .q{font-weight:900;color:var(--ac);margin-right:6px}
.tk .ii .nota{display:block;margin-top:4px;color:var(--wa);font-weight:700;font-size:.92em}
.ps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ps button{padding:7px 11px;border-radius:10px;border:2px solid var(--bd);font-weight:700;font-size:.88em;min-height:40px;background:var(--pn2)}
.ps button.h{border-color:var(--wa);background:#f5b03126;color:var(--wa)}
.ps button.l{border-color:var(--ok);background:#2fbf7126;color:var(--ok)}
.ps button.l:before{content:"✓ "}
.ps button.off{opacity:.28}
.tk footer{padding:10px 14px;margin-top:auto;display:flex;gap:8px}
.tk.listo{opacity:.6}
.vacio{padding:60px 20px;text-align:center;color:var(--mu);font-size:1.1em}

/* Config */
.cfg{max-width:1000px;margin:0 auto;padding:16px;width:100%}
.cfg .tabs{margin-bottom:14px}
.mi{display:grid;grid-template-columns:54px minmax(0,1fr) 110px 150px auto;gap:8px;align-items:center;padding:8px;border-radius:12px;background:var(--pn2);margin-bottom:6px}
@media(max-width:700px){.mi{grid-template-columns:48px 1fr 90px;}.mi .cc,.mi .aa{grid-column:span 3}}
.mi .in{min-height:38px;padding:7px 10px}
.pasos .row{margin-bottom:6px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.qrs .q{border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;background:#fff;color:#111}
.qrs .q svg{width:100%;height:auto;display:block}

<script>
'use strict';
/* =====================================================================
   Fork · pantallas
   Rutas (todo va después del #):
     #/                          inicio
     #/<local>                   landing con pedidos online
     #/<local>/menu?mesa=<id>    menú QR de una mesa
     #/<local>/pedido/<id>       seguimiento de un pedido
     #/<local>/pared             TV vertical: en preparación y listos
     #/<local>/ventana/<puesto>  pantalla de la ventanilla que mira a la gente
     #/<local>/caja/<puesto>     pantalla de quien atiende la ventanilla
     #/<local>/cocina            comandas desglosadas en pasos
     #/<local>/mostrador         mesas y pedidos de todos los orígenes
     #/<local>/panel             accesos a todas las pantallas
     #/<local>/config            configuración (sólo administrador)
   Los locales cuyo nombre empieza con "demo-" o "local-" funcionan sin
   servidor: guardan todo en este navegador y se sincronizan entre pestañas.
   ===================================================================== */
const H = window.ForkHub;
const esDemo = (s) => /^demo-/.test(s || '');
const demoDe = (t) => 'demo-' + t.id;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plata = (n) => '$' + Math.round(n || 0).toLocaleString('es-AR');
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* lleno o bloqueado */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* nada */ } }
};
const ORIG = { M: 'Mesa', V: 'Ventana', W: 'Web', D: 'Envío', E: 'Externo' };
const MEDIO = { efectivo: 'Efectivo', alias: 'Transferencia', mp: 'Mercado Pago', tarjeta: 'Tarjeta', app: 'Pagado en la app', mesa: 'En la mesa' };
const EST = { nuevo: 'Por confirmar', prep: 'En preparación', listo: 'Listo', encamino: 'En camino', entregado: 'Entregado', cancelado: 'Cancelado' };
const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

let SYNC = null;   // conexión activa
let PANT = null;   // pantalla activa
let R = null;      // ruta actual
let SERVIDOR = null;

const ahora = () => Date.now() + (SYNC ? SYNC.offset : 0);
const E = () => SYNC && SYNC.E;
const mmss = (ms) => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const minutos = (ms) => Math.max(0, Math.round(ms / 60000));
const reloj = () => new Date(ahora()).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: (E() && E().cfg.tz) || undefined });

function toast(msg, tipo) {
  const d = document.createElement('div');
  d.textContent = msg;
  if (tipo) d.className = tipo;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), 3200);
}
function modal(html, clase) {
  const m = document.createElement('div');
  m.className = 'mod ' + (clase || '');
  m.innerHTML = '<div class="bx">' + html + '</div>';
  m.addEventListener('click', (e) => { if (e.target === m || e.target.closest('[data-cerrar]')) cerrar(); });
  function cerrar() { m.remove(); if (m.alCerrar) m.alCerrar(); }
  m.cerrar = cerrar;
  document.body.appendChild(m);
  return m;
}
function qrSVG(texto, oscuro) {
  const q = qrcode(0, 'M');
  q.addData(texto);
  q.make();
  const n = q.getModuleCount();
  let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += 'M' + x + ' ' + y + 'h1v1h-1z';
  return '<svg viewBox="-2 -2 ' + (n + 4) + ' ' + (n + 4) + '" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) + '" fill="#fff"/><path d="' + d + '" fill="' + (oscuro || '#111') + '"/></svg>';
}
function base() { return location.href.split('#')[0]; }
function url(slug, ruta, q) { return base() + '#/' + slug + (ruta ? '/' + ruta : '') + (q ? '?' + q : ''); }
async function copiar(t) {
  try { await navigator.clipboard.writeText(t); toast('Copiado', 'ok'); }
  catch (e) { const i = document.createElement('textarea'); i.value = t; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); toast('Copiado', 'ok'); }
}
/* ---------- Plugin de tienda activo: estética y textos ---------- */
const TXT = {
  paredPrep: 'En preparación', paredListo: '¡Listo! Retirá', prepTit: 'Lo estamos preparando', listoTit: '¡Está listo!',
  listoRetira: 'Retiralo en la ventanilla con tu número.', listoMesa: 'Ya va para tu mesa.', disfruta: '¡Que lo disfrutes!',
  resena: '¿Cómo estuvo?', cocinaVacia: '🔥 Sin comandas. A esperar la próxima.', tocaPedir: 'Tocá para pedir'
};
function TIENDA() { return (E() && H.tiendas[E().cfg.tienda]) || null; }
function T(k) { const t = TIENDA(); return (t && t.textos && t.textos[k]) || TXT[k]; }
function aplicarTema() {
  const t = TIENDA();
  const c = (E() && E().cfg.color) || (t && t.tema.color) || '#ff6a1a';
  document.documentElement.style.setProperty('--ac', c);
  document.documentElement.style.setProperty('--ac2', c + '22');
  document.body.dataset.tienda = t ? t.id : '';
  let css = '';
  if (t && t.tema) {
    const v = (o) => Object.keys(o || {}).map((k) => '--' + k + ':' + o[k]).join(';');
    css = 'body[data-tienda="' + t.id + '"]{--fT:' + (t.tema.titulos || 'inherit') + '}' +
      'body[data-tienda="' + t.id + '"]:not(.claro){' + v(t.tema.oscuro) + '}' +
      'body[data-tienda="' + t.id + '"].claro{' + v(t.tema.claro) + '}' + (t.tema.css || '');
  }
  let el = $('#tema');
  if (!el) { el = document.createElement('style'); el.id = 'tema'; document.head.appendChild(el); }
  if (el.textContent !== css) el.textContent = css;
}
const colorLocal = aplicarTema;
function logo(cfg, clase) {
  return cfg.logo ? '<img class="' + (clase || 'logo') + '" src="' + esc(cfg.logo) + '" alt="">' : '<span class="em">' + esc(cfg.emoji || '🍽️') + '</span>';
}
function nombreMesa(id) { const m = E().mesas[id]; return m ? 'Mesa ' + m.n : 'Mesa'; }
function origenTxt(p) {
  if (p.origen === 'M') return nombreMesa(p.mesa);
  if (p.origen === 'E') return (p.ext && p.ext.app) || 'Externo';
  if (p.origen === 'D') return '🛵 ' + ((p.envio && p.envio.zona) || 'Envío');
  return ORIG[p.origen];
}
function proximoPaso(p) {
  for (const it of p.items) for (const s of it.pasos) if (s.e !== 'l') return s.n + ' de ' + it.n;
  return '';
}
function lista(obj) { return Object.keys(obj || {}).map((k) => obj[k]); }
function itemsMenu() { return lista(E().menu.items).sort((a, b) => (E().menu.cats.indexOf(a.cat) - E().menu.cats.indexOf(b.cat)) || (a.orden - b.orden)); }
function estaciones() {
  const s = new Set();
  lista(E().menu.items).forEach((i) => (i.pasos || []).forEach((p) => p.est && s.add(p.est)));
  return [...s];
}

/* ---------- Sonido ---------- */
let AUDIO = null;
function sonar(tipo) {
  try {
    AUDIO = AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const notas = tipo === 'nuevo' ? [660, 880] : [880, 1175, 1568];
    notas.forEach((f, i) => {
      const o = AUDIO.createOscillator(), g = AUDIO.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t = AUDIO.currentTime + i * 0.16;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(AUDIO.destination); o.start(t); o.stop(t + 0.4);
    });
    if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(200);
  } catch (e) { /* sin audio */ }
}

/* =====================================================================
   Sincronización
   ===================================================================== */
const SIN_RED_OK = { paso: 1, estado: 1, pago: 1, llamar: 1, mesa: 1, atendido: 1, carrito: 1, confirmar: 1 };

class Sync {
  constructor(slug, nivel) {
    this.slug = slug;
    this.nivel = nivel;                     // 'p' público o 's' personal
    this.local = /^(demo|local)-/.test(slug);
    this.rol = nivel === 'p' ? 'publico' : (this.local ? 'admin' : 'staff');
    this.E = null; this.subs = []; this.pend = new Map(); this.offset = 0; this.n = 0; this.intentos = 0;
    this.est = this.local ? 'local' : 'conectando';
    this.kE = 'fork:st:' + slug + ':' + nivel;
    this.kQ = 'fork:q:' + slug;
  }
  on(f) { this.subs.push(f); }
  emit(t) { this.subs.forEach((f) => { try { f(t); } catch (e) { console.error(e); } }); }
  iniciar() {
    if (this.local) {
      this.kE = 'fork:st:' + this.slug;
      let st = LS.get(this.kE);
      const tDemo = esDemo(this.slug) && H.tiendas[this.slug.slice(5)];
      if (tDemo && (!st || st.v !== H.nuevo().v)) { st = H.demo(tDemo); LS.set(this.kE, st); }
      if (!st) return Promise.reject(new Error('noexiste'));
      this.E = st;
      if ('BroadcastChannel' in window) {
        this.bc = new BroadcastChannel('fork:' + this.slug);
        this.bc.onmessage = () => this.releer();
      }
      this._st = (e) => { if (e.key === this.kE) this.releer(); };
      addEventListener('storage', this._st);
      return Promise.resolve();
    }
    this.E = LS.get(this.kE, null);
    if (this.E) this.rol = LS.get(this.kE + ':rol', this.rol);
    return new Promise((ok, no) => {
      this.primero = { ok, no };
      this.conectar();
      if (this.E) { this.primero = null; ok(); }
    });
  }
  releer() { const st = LS.get(this.kE); if (st) { this.E = st; this.emit('cambios'); } }
  cerrar() {
    this.cerrado = true;
    if (this.bc) this.bc.close();
    if (this._st) removeEventListener('storage', this._st);
    if (this.ws) try { this.ws.close(); } catch (e) { /* nada */ }
    clearInterval(this.latido); clearTimeout(this.reint);
  }
  clave() { return this.nivel === 'p' ? '' : LS.get('fork:k:' + this.slug, ''); }
  conectar() {
    if (this.cerrado) return;
    const k = this.clave();
    const u = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/api/l/' + this.slug + '/ws' + (k ? '?k=' + encodeURIComponent(k) : '');
    let ws;
    try { ws = new WebSocket(u); } catch (e) { return this.reintentar(); }
    this.ws = ws; this.est = 'conectando'; this.emit('conexion');
    ws.onmessage = (ev) => {
      if (ev.data === 'pong') return;
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'todo') {
        this.E = m.E; this.rol = m.rol; this.pin = m.pin; this.offset = m.hora - Date.now();
        this.est = 'en línea'; this.intentos = 0;
        LS.set(this.kE, this.E); LS.set(this.kE + ':rol', this.rol);
        const cola = LS.get(this.kQ, []);
        if (cola.length) { LS.del(this.kQ); cola.forEach((op) => this.enviar(op).catch(() => {})); }
        if (this.primero) { this.primero.ok(); this.primero = null; }
        this.emit('todo'); this.emit('conexion');
      } else if (m.t === 'cambios') {
        m.cambios.forEach((ch) => H.cambiar(this.E, ch));
        clearTimeout(this.guardar); this.guardar = setTimeout(() => LS.set(this.kE, this.E), 800);

const PANTALLAS = {};
function ruta() {
  const h = location.hash.replace(/^#\/?/, '');
  const [camino, qs] = h.split('?');
  const partes = camino.split('/').filter(Boolean).map(decodeURIComponent);
  const q = new URLSearchParams(qs || '');
  return { slug: partes[0] || '', pant: partes[1] || (partes[0] ? 'menu' : ''), param: partes[2] || '', q };
}
async function navegar() {
  const r = ruta();
  if (PANT && PANT.salir) PANT.salir();

  document.body.className = '';
  document.title = 'Fork · Pedidos, cocina y entrega para tu local';
  if (!r.slug) { R = r; return pantallaInicio(); }
  const def = PANTALLAS[r.pant];
  if (!def) { location.hash = '#/' + r.slug; return; }
  // Link de administrador o PIN en la URL: se guarda y se limpia
  const k = r.q.get('k');
  if (k) {

    const qs = r.q.toString();
    history.replaceState(null, '', '#/' + r.slug + '/' + r.pant + (r.param ? '/' + r.param : '') + (qs ? '?' + qs : ''));
    if (SYNC && SYNC.slug === r.slug) { SYNC.cerrar(); SYNC = null; }
  }
  R = r;
  const nivel = def.nivel;
  const local = /^(demo|local)-/.test(r.slug);
  if (!local && nivel !== 'p' && !LS.get('fork:k:' + r.slug)) return pantallaPin(r);
  if (!SYNC || SYNC.slug !== r.slug || SYNC.nivel !== nivel) {
    if (SYNC) SYNC.cerrar();
    SYNC = new Sync(r.slug, nivel);
    $('#app').innerHTML = '<div class="vacio">Cargando…</div>';
    try { await SYNC.iniciar(); }
    catch (e) {
      SYNC = null;
      if (e.message === 'pin') return pantallaPin(r, 'El PIN no es válido');
      return pantallaError('Este local no existe', local ? 'Los locales de prueba viven sólo en el navegador donde se crearon.' : 'Revisá el link o pedile uno nuevo al encargado.');
    }
    SYNC.on((t) => {
      if (!PANT) return;
      if (t === 'conexion') { pintarConexion(); return; }
      colorLocal();
      if (PANT.actualizar) PANT.actualizar(t);
    });
    if (!local && SERVIDOR === null) SERVIDOR = true;
  }
  if (def.admin && SYNC.rol !== 'admin') return pantallaError('Sólo para el administrador', 'Abrí la configuración desde el link de administrador que recibiste al crear el local.');
  colorLocal();
  PANT = def;
  document.title = (def.titulo ? def.titulo + ' · ' : '') + E().cfg.nombre;
  def.montar($('#app'), r);
  pintarConexion();
}

/* =====================================================================
   Opciones de producto: sabores, extras, salsas, rolls a elección
   ===================================================================== */
const opsTxt = (it) => (it && it.ops || []).map((o) => o.v).join(' · ');
function htmlOps(it, clase) {
  const t = opsTxt(it);
  return t ? '<span class="ops ' + (clase || '') + '">' + esc(t) + '</span>' : '';
}
function tieneOpciones(pr) { return !!(pr && pr.opciones && pr.opciones.length); }
function elegirOpciones(prod, listo, clase) {
  const sel = {};
  prod.opciones.forEach((g) => { sel[g.id] = g.t === 'surtido' ? {} : []; });
  const md = modal('', clase || '');
  const suma = (o) => Object.values(o).reduce((s, x) => s + x, 0);
  const pintar = () => {
    const r = H.linea(E(), { p: prod.id, q: 1, op: sel });
    md.firstChild.innerHTML = '<div class="row" style="align-items:flex-start"><span style="font-size:2.4em;line-height:1">' + esc(prod.emoji || '🍽️') + '</span><div class="sp"><div class="tit">' + esc(prod.nombre) + '</div>' +
      (prod.desc ? '<div class="mu sm">' + esc(prod.desc) + '</div>' : '') + '</div><button class="bt sm gh" data-cerrar>✕</button></div>' +
      prod.opciones.map((g) => {
        let ayuda, ok, cuerpo;
        if (g.t === 'surtido') {
          const tot = suma(sel[g.id]);
          ok = tot === g.total;
          ayuda = ok ? '✓ ' + g.total + ' de ' + g.total : 'Elegí ' + g.total + ' · faltan ' + (g.total - tot);
          cuerpo = g.items.map((it) => '<div class="sur"><span class="sp">' + esc(it.n) + (it.precio ? ' <span class="mu sm">+' + plata(it.precio) + ' c/u</span>' : '') + '</span>' +
            (it.agotado ? '<span class="chip bad">Agotado</span>' : '<div class="stp"><button data-sm="' + esc(g.id) + '" data-n="' + esc(it.n) + '">−</button><b class="n">' + (sel[g.id][it.n] || 0) + '</b><button class="mas" data-sp="' + esc(g.id) + '" data-n="' + esc(it.n) + '">+</button></div>') + '</div>').join('') +
            (!ok && tot < g.total ? '<button class="bt sm gh" style="margin-top:8px" data-rep="' + esc(g.id) + '">Completar repartiendo parejo</button>' : '');
        } else {
          const n = sel[g.id].length;
          ok = !g.req || n > 0;
          ayuda = g.t === 'uno' ? (g.req ? (n ? '✓' : 'Elegí una') : 'Opcional') : (g.max ? 'Hasta ' + g.max : 'Opcional');
          cuerpo = '<div class="chips">' + g.items.map((it) => '<button data-g="' + esc(g.id) + '" data-n="' + esc(it.n) + '" class="' + (sel[g.id].indexOf(it.n) >= 0 ? 'on' : '') + '"' + (it.agotado ? ' disabled' : '') + '>' +
            esc(it.n) + (it.precio ? ' <span class="n">+' + plata(it.precio) + '</span>' : '') + '</button>').join('') + '</div>';
        }
        return '<div class="opg"><div class="row" style="margin-bottom:8px"><b>' + esc(g.n) + '</b><span class="sp"></span><span class="chip ' + (ok ? 'ok' : 'wa') + '">' + ayuda + '</span></div>' + cuerpo + '</div>';
      }).join('') +
      '<button class="bt ac xl" style="width:100%;margin-top:18px" data-ok' + (r.err ? ' disabled' : '') + '>Agregar · ' + plata(r.item ? r.item.precio : prod.precio) + '</button>';
  };
  md.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.g) {
      const g = prod.opciones.find((x) => x.id === d.g), arr = sel[d.g], i = arr.indexOf(d.n);
      if (g.t === 'uno') sel[d.g] = i >= 0 && !g.req ? [] : [d.n];
      else if (i >= 0) arr.splice(i, 1);
      else if (g.max && arr.length >= g.max) { toast('Hasta ' + g.max + ' en ' + g.n.toLowerCase()); return; }
      else arr.push(d.n);
    } else if (d.sp || d.sm) {
      const id = d.sp || d.sm, g = prod.opciones.find((x) => x.id === id), o = sel[id];
      if (d.sp) { if (suma(o) >= g.total) { toast('Ya elegiste ' + g.total); return; } o[d.n] = (o[d.n] || 0) + 1; }
      else if (o[d.n]) { o[d.n]--; if (!o[d.n]) delete o[d.n]; }
    } else if (d.rep != null) {
      const g = prod.opciones.find((x) => x.id === d.rep), o = sel[d.rep];
      const disp = g.items.filter((x) => !x.agotado);
      let i = 0;
      while (suma(o) < g.total && disp.length) {
        const menor = disp.slice().sort((a, b) => (o[a.n] || 0) - (o[b.n] || 0))[0];
        o[menor.n] = (o[menor.n] || 0) + 1; if (++i > 999) break;
      }
    } else if (d.ok != null) {
      const op = {};
      Object.keys(sel).forEach((k) => { const v = sel[k]; if (Array.isArray(v) ? v.length : Object.keys(v).length) op[k] = v; });
      md.cerrar();
      listo(H.clon(op));
      return;
    } else return;
    pintar();
  });
  pintar();
  return md;
}
function notasRapidas() { const t = TIENDA(); return (t && t.notas) || ['Sin sal', 'Aparte', 'Bien cocido', 'Sin picante']; }

/* =====================================================================
   POS: carga rápida de pedidos (caja y mostrador)
   ===================================================================== */
function crearPOS(alCambiar) {
  const P = { items: [], cat: '', nombre: '', medio: 'efectivo', pagado: false };
  P.linea = (x) => H.linea(E(), x).item;
  P.total = () => P.items.reduce((s, x) => { const l = P.linea(x); return s + (l ? l.precio * x.q : 0); }, 0);
  P.cant = (id) => P.items.filter((x) => x.p === id).reduce((s, x) => s + x.q, 0);
  P.vaciar = () => { P.items = []; P.nombre = ''; P.pagado = false; P.medio = 'efectivo'; };
  P.agregar = (id) => {
    const pr = E().menu.items[id];
    if (!pr) return;
    if (tieneOpciones(pr)) { elegirOpciones(pr, (op) => { P.items.push({ p: id, q: 1, nota: '', op }); alCambiar(); }); return; }
    const ex = P.items.find((x) => x.p === id && !x.nota && !x.op);
    if (ex) ex.q++; else P.items.push({ p: id, q: 1, nota: '' });
    alCambiar();
  };
  P.htmlProductos = () => {
    const cats = E().menu.cats;
    if (!P.cat || cats.indexOf(P.cat) < 0) P.cat = cats[0] || '';
    return '<div class="tabs">' + cats.map((c) => '<button data-a="pcat" data-v="' + esc(c) + '" class="' + (c === P.cat ? 'on' : '') + '">' + esc(c) + '</button>').join('') + '</div>' +
      '<div class="prods">' + itemsMenu().filter((i) => i.cat === P.cat).map((i) =>
        '<button data-a="padd" data-v="' + esc(i.id) + '"' + (i.agotado ? ' disabled style="opacity:.35"' : '') + '>' + (P.cant(i.id) ? '<span class="q">' + P.cant(i.id) + '</span>' : '') +
        '<span class="e">' + esc(i.emoji || '🍽️') + '</span><span>' + esc(i.nombre) + '</span><span class="mu sm n">' + (i.agotado ? 'Agotado' : plata(i.precio)) + (tieneOpciones(i) ? ' · ⚙' : '') + '</span></button>').join('') + '</div>';
  };
  P.htmlCarrito = (conPago) => {
    if (!P.items.length) return '<div class="vacio" style="padding:26px 10px">Tocá productos para armar el pedido</div>';
    return P.items.map((x, i) => {
      const l = P.linea(x); if (!l) return '';
      return '<div class="lin"><div class="stp"><button data-a="pmenos" data-v="' + i + '">−</button><b class="n">' + x.q + '</b><button class="mas" data-a="pmas" data-v="' + i + '">+</button></div>' +
        '<div class="sp"><div class="b">' + esc(l.n) + '</div>' + htmlOps(l) + (x.nota ? '<div class="sm" style="color:var(--wa)">' + esc(x.nota) + '</div>' : '') + '</div>' +
        '<button class="bt sm gh" data-a="pnota" data-v="' + i + '">Nota</button><span class="n b">' + plata(l.precio * x.q) + '</span></div>';
    }).join('') +
      '<div class="row" style="margin-top:10px;font-size:1.3em"><b>Total</b><span class="sp"></span><b class="n">' + plata(P.total()) + '</b></div>' +
      (conPago ? '<input class="in" style="margin-top:10px" data-a="pnombre" placeholder="Nombre (opcional)" value="' + esc(P.nombre) + '" maxlength="40">' +
        '<div class="row w" style="margin-top:10px">' + ['efectivo', 'alias', 'mp', 'tarjeta'].map((m) => '<button class="bt sm ' + (P.medio === m ? 'ac' : 'gh') + '" data-a="pmedio" data-v="' + m + '">' + MEDIO[m] + '</button>').join('') + '</div>' +
        '<label class="sw" style="margin-top:12px"><input type="checkbox" data-a="ppagado"' + (P.pagado ? ' checked' : '') + '> Ya está pagado</label>' : '');
  };
  P.click = (a, el) => {
    if (a === 'padd') { P.agregar(el.dataset.v); return true; }
    if (a === 'pcat') P.cat = el.dataset.v;
    else if (a === 'pmas') P.items[+el.dataset.v].q++;
    else if (a === 'pmenos') { const x = P.items[+el.dataset.v]; x.q--; if (x.q <= 0) P.items.splice(+el.dataset.v, 1); }
    else if (a === 'pmedio') P.medio = el.dataset.v;
    else if (a === 'pnota') {
      const x = P.items[+el.dataset.v];
      const m = modal('<div class="tit">Nota para ' + esc(E().menu.items[x.p].nombre) + '</div><input class="in" id="nt" style="margin:14px 0" maxlength="120" placeholder="Lo que la cocina tiene que saber" value="' + esc(x.nota) + '">' +
        '<div class="row w" style="margin-bottom:12px">' + notasRapidas().map((t) => '<button class="bt sm gh" data-t="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>' +
        '<button class="bt ac" style="width:100%" id="ntok">Listo</button>');
      const inp = $('#nt', m); inp.focus();
      m.addEventListener('click', (e) => { const t = e.target.closest('[data-t]'); if (t) inp.value = (inp.value ? inp.value + ', ' : '') + t.dataset.t.toLowerCase(); });
      $('#ntok', m).onclick = () => { x.nota = inp.value.trim(); m.cerrar(); alCambiar(); };
      return true;
    } else return false;
    alCambiar();
    return true;
  };
  P.input = (el) => {
    if (el.dataset.a === 'pnombre') { P.nombre = el.value; return true; }
    if (el.dataset.a === 'ppagado') { P.pagado = el.checked; return true; }
    return false;
  };
  return P;
}

    let medio = LS.get('fork:medio', medios[0] || 'efectivo');

    const pintar = () => {

        (mesa ? '<div class="row" style="font-size:1.25em;margin-bottom:14px"><b>Total</b><span class="sp"></span><b class="n">' + plata(sub) + '</b></div><p class="mu sm" style="margin-bottom:12px">Va directo a la cocina. Pagás al final, cuando pidas la cuenta.</p>' :

          '<div class="col"><label class="f">Tu nombre<input class="in" id="ck-n" maxlength="40" value="' + esc(datos.nombre) + '" autocomplete="given-name"></label>' +
          '<label class="f">Teléfono' + (envio() ? '' : ' (opcional)') + '<input class="in" id="ck-t" maxlength="30" inputmode="tel" value="' + esc(datos.tel) + '" autocomplete="tel"></label>' +
          (envio() ? '<label class="f">Zona<select class="in" id="ck-z"><option value="">Elegí tu barrio</option>' + (ce.zonas || []).map((z) => '<option value="' + esc(z.n) + '"' + (z.n === datos.zona ? ' selected' : '') + '>' + esc(z.n) + ' · envío ' + plata(z.costo) + '</option>').join('') + '</select></label>' +
            '<label class="f">Dirección<input class="in" id="ck-d" maxlength="120" value="' + esc(datos.dir) + '" placeholder="Calle y número" autocomplete="street-address"></label>' +
            '<label class="f">Referencia (opcional)<input class="in" id="ck-r" maxlength="120" value="' + esc(datos.ref) + '" placeholder="Piso, timbre, entre calles, color de la casa"></label>' +

    m.addEventListener('change', (e) => { if (e.target.id === 'ck-z') re(); });
    m.addEventListener('click', async (e) => {
      const mo = e.target.closest('[data-modo]');
      if (mo) { guardarDatos(); modo = mo.dataset.modo; LS.set('fork:modo', modo); m.firstChild.innerHTML = pintar(); return; }
      const md = e.target.closest('[data-medio]');
      if (md) { guardarDatos(); medio = md.dataset.medio; LS.set('fork:medio', medio); m.firstChild.innerHTML = pintar(); return; }
      if (e.target.closest('[data-ubic]')) {
        guardarDatos();
        if (!navigator.geolocation) return toast('Este celular no permite compartir la ubicación', 'bad');
        toast('Buscando tu ubicación…');
        navigator.geolocation.getCurrentPosition((pos) => {
          datos.lat = Math.round(pos.coords.latitude * 1e6) / 1e6; datos.lng = Math.round(pos.coords.longitude * 1e6) / 1e6;
          LS.set('fork:yo', datos); m.firstChild.innerHTML = pintar(); toast('Ubicación guardada', 'ok');
        }, () => toast('No pudimos obtener la ubicación. Con la dirección alcanza', 'bad'), { enableHighAccuracy: true, timeout: 10000 });
        return;
      }
      const b = e.target.closest('[data-a]');
      if (b) {
        guardarDatos();
        const k = b.dataset.v, x = CARRO.items[k];
        if (!x) return;
        if (b.dataset.a === 'mas') x.q++;
        if (b.dataset.a === 'menos') { x.q--; if (x.q <= 0) delete CARRO.items[k]; }
        this.guardarCarro(); m.firstChild.innerHTML = pintar(); return;
      }
      if (e.target.id === 'ck-ok') {
        guardarDatos();
        if (!mesa && !datos.nombre.trim()) { toast('Poné tu nombre para llamarte cuando esté listo', 'bad'); $('#ck-n', m).focus(); return; }
        if (envio()) {
          if (!datos.tel.trim()) { toast('Dejanos un teléfono para que el cadete pueda avisarte', 'bad'); $('#ck-t', m).focus(); return; }
          if (!datos.zona) { toast('Elegí tu barrio', 'bad'); $('#ck-z', m).focus(); return; }
          if (!datos.dir.trim()) { toast('Falta la dirección', 'bad'); $('#ck-d', m).focus(); return; }
        }
        e.target.disabled = true;
        const items = this.lineas().map(({ x }) => ({ p: x.p, q: x.q, nota: x.nota, op: x.op }));
        const v = mesa ? { origen: 'M', mesa: this.mesa, items }
          : envio() ? { origen: 'D', nombre: datos.nombre, tel: datos.tel, items, pago: { m: medio }, envio: { zona: datos.zona, dir: datos.dir, ref: datos.ref, lat: datos.lat, lng: datos.lng } }
            : { origen: 'W', nombre: datos.nombre, tel: datos.tel, items, pago: { m: medio } };
        try {
          const p = await hacer({ o: 'pedido', v });
          CARRO.items = {}; this.guardarCarro();
          const mis = LS.get('fork:mis:' + R.slug, []); mis.unshift(p.id); LS.set('fork:mis:' + R.slug, mis.slice(0, 20));
          m.alCerrar = null; m.cerrar();

        } catch (er) { e.target.disabled = false; }
      }
    });
    function guardarDatos() {
      const g = (id) => $(id, m);
      if (g('#ck-n')) { datos.nombre = g('#ck-n').value; datos.tel = g('#ck-t').value; }
      if (g('#ck-d')) { datos.dir = g('#ck-d').value; datos.ref = g('#ck-r').value; datos.zona = g('#ck-z').value; }
      LS.set('fork:yo', datos);
    }
  }
};

    el.innerHTML = '<div class="tit">Tu pedido</div>' + (this.carro.length ? ls.map((o, i) => {

  async click(e) {
    this.toque = Date.now();
    // En reposo, tocar en cualquier parte de la pantalla arranca el pedido
    if (this.modo === 'reposo' && !this.espejo()) { this.modo = 'auto'; this.carro = []; this.nombre = ''; this.pintar(); return; }
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a, v = el.dataset.v;
    if (a === 'empezar') { this.modo = 'auto'; this.carro = []; this.nombre = ''; this.pintar(); }
    else if (a === 'salir') { this.modo = 'reposo'; this.carro = []; this.pintar(); }
    else if (a === 'vcat') { this.cat = v; this.pintarAuto(); }
    else if (a === 'vadd') {
      const pr = E().menu.items[v];
      if (tieneOpciones(pr)) { elegirOpciones(pr, (op) => { this.carro.push({ p: v, q: 1, op }); this.pintarAuto(); }, 'kiosco'); return; }
      const ex = this.carro.find((x) => x.p === v && !x.op); if (ex) ex.q++; else this.carro.push({ p: v, q: 1 }); this.pintarAuto();
    }
    else if (a === 'vmas') { this.carro[+v].q++; this.pintarCarro(); }
    else if (a === 'vmenos') { const x = this.carro[+v]; x.q--; if (x.q <= 0) this.carro.splice(+v, 1); this.pintarAuto(); }
    else if (a === 'venviar') {
      el.disabled = true;
      try {
        const p = await hacer({ o: 'pedido', v: { origen: 'V', autopedido: true, puesto: this.puesto, nombre: this.nombre, items: this.carro, pago: { m: 'efectivo' } } });
        this.listo = p.num; this.modo = 'numero'; this.carro = []; this.pintar();
      } catch (er) { el.disabled = false; }
    }
  }
};

/* =====================================================================
   Ventana · Operador (caja rápida de takeaway)
   ===================================================================== */
PANTALLAS.caja = {
  nivel: 's', titulo: 'Ventana · Operador',
  montar(root, r) {
    this.root = root; this.puesto = r.param || 'v1'; this.tab = 'conf';
    this.pos = crearPOS(() => { this.fase = ''; this.pintarPOS(); this.espejo(); });
    root.innerHTML = '<div class="app">' + barra('Ventana · Operador', '<button class="bt sm gh" data-a="lanzar">Mostrar total al cliente</button><button class="bt sm gh" data-a="ajimp" title="Impresión">🖨</button>') +
      '<div class="cuerpo caja"><div class="pn" id="cj-prod"></div><div class="col" style="min-height:0"><div class="pn" id="cj-carro"></div><div class="pn col" id="cj-ped" style="min-height:260px"></div></div></div></div>';
    root.onclick = (e) => this.click(e);
    root.oninput = (e) => { if (this.pos.input(e.target)) this.espejo(); };
    root.onchange = (e) => { if (this.pos.input(e.target)) this.espejo(); };
    this.pintarPOS(); this.pintarPedidos();
  },
  salir() { clearTimeout(this.tEsp); },
  actualizar() { this.pintarPedidos(); if (!this.pos.items.length) this.pintarPOS(); },
  tic() { if (!this.t5 || Date.now() - this.t5 > 15000) { this.t5 = Date.now(); this.pintarPedidos(); } },
  pintarPOS() {
    $('#cj-prod').innerHTML = this.pos.htmlProductos();
    $('#cj-carro').innerHTML = '<div class="row"><div class="tit sp">Pedido nuevo</div>' + (this.pos.items.length ? '<button class="bt sm gh" data-a="cvaciar">Vaciar</button>' : '') + '</div>' +
      this.pos.htmlCarrito(true) +
      (this.pos.items.length ? '<button class="bt ok xl" style="width:100%;margin-top:12px" data-a="cenviar">Enviar a cocina</button>' : '');
  },
  espejo() {
    clearTimeout(this.tEsp);
    this.tEsp = setTimeout(() => {
      hacer({ o: 'carrito', puesto: this.puesto, v: { items: this.pos.items, medio: this.pos.medio, fase: this.fase || '' } }).catch(() => {});
    }, 250);
  },
  pintarPedidos() {
    const st = E(), t = ahora();
    const act = H.activos(st).filter((p) => p.origen !== 'M');
    const conf = act.filter((p) => p.estado === 'nuevo');
    const prep = act.filter((p) => p.estado === 'prep');
    const listos = act.filter((p) => p.estado === 'listo');
    const camino = act.filter((p) => p.estado === 'encamino');
    const tabs = [['conf', 'Para confirmar', conf], ['prep', 'En cocina', prep], ['listo', 'Listos', listos]];
    if (camino.length || (st.cfg.envio || {}).activo) tabs.push(['camino', 'En camino', camino]);
    if (!tabs.some((x) => x[0] === this.tab)) this.tab = 'conf';
    const sel = tabs.find((x) => x[0] === this.tab)[2];
    $('#cj-ped').innerHTML = '<div class="tabs">' + tabs.map((x) => '<button data-a="ctab" data-v="' + x[0] + '" class="' + (this.tab === x[0] ? 'on' : '') + '">' + x[1] + '<span class="c">' + x[2].length + '</span></button>').join('') + '</div>' +
      '<div class="lista">' + (sel.length ? sel.map((p) => tarjetaPedido(p, t)).join('') : '<div class="vacio" style="padding:30px">Nada por acá</div>') + '</div>';
  },
  async click(e) {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a;
    if (this.pos.click(a, el) !== false && a.charAt(0) === 'p') return;
    if (a === 'ctab') { this.tab = el.dataset.v; this.pintarPedidos(); return; }
    if (a === 'ajimp') { ajustesImpresion('caja'); return; }
    if (a === 'cvaciar') { this.pos.vaciar(); this.pintarPOS(); this.espejo(); return; }
    if (a === 'lanzar') { if (!this.pos.items.length) return toast('Primero cargá el pedido'); this.fase = 'pago'; this.espejo(); toast('El cliente ya ve el total y cómo pagar'); return; }
    if (a === 'cenviar') {
      el.disabled = true;
      try {
        const p = await hacer({ o: 'pedido', v: { origen: 'V', puesto: this.puesto, nombre: this.pos.nombre, items: this.pos.items, pago: { m: this.pos.medio, ok: this.pos.pagado } } });
        toast(p.num + ' enviado a cocina', 'ok');
        imprimirAlMandar(p);
        await hacer({ o: 'carrito', puesto: this.puesto, v: { items: [], fase: 'listo', num: p.num } }).catch(() => {});
        clearTimeout(this.tLim); this.tLim = setTimeout(() => hacer({ o: 'carrito', puesto: this.puesto, v: null }).catch(() => {}), 8000);
        this.pos.vaciar(); this.fase = ''; this.pintarPOS();
      } catch (er) { el.disabled = false; }
      return;
    }
    accionPedido(a, el);
  }
};

/* Tarjeta de pedido para caja y mostrador */
function tarjetaPedido(p, t) {
  const min = minutos(t - (p.prep || p.creado));
  const eta = H.eta(E(), p);
  const pago = p.pago.ok ? '<span class="chip ok">Pagado · ' + MEDIO[p.pago.m] + '</span>' : '<span class="chip ' + (p.origen === 'M' ? '' : 'bad') + '">' + (p.origen === 'M' ? 'Cuenta abierta' : 'Falta pago · ' + MEDIO[p.pago.m]) + '</span>';
  const id = p.id, envio = p.origen === 'D';
  let acc = '';

async function accionPedido(a, el) {
  const id = el.dataset.id;
  const p = id && E().pedidos[id];
  if (!p) return;
  if (a === 'confirmar') { await hacer({ o: 'confirmar', id, pago: el.dataset.pago ? { m: p.pago.m, ok: true } : null }, p.num + ' a cocina'); imprimirAlMandar(E().pedidos[id]); }
  if (a === 'rechazar') { if (confirm('¿Rechazar el pedido ' + p.num + '?')) await hacer({ o: 'estado', id, e: 'cancelado' }, 'Pedido rechazado'); }
  if (a === 'cobrado') await hacer({ o: 'pago', id, m: p.pago.m === 'app' || p.pago.m === 'mesa' ? 'efectivo' : p.pago.m, ok: true }, 'Marcado como pagado');
  if (a === 'forzar') await hacer({ o: 'estado', id, e: 'listo' });

  if (a === 'entregarEnvio') entregarEnvio(p);

}

function waNum(t) {

function mapaDe(p) {

  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(p.envio.dir + (c.ciudad ? ', ' + c.ciudad : ''));

function textoEnvio(p) {
  const c = E().cfg;
  return 'Retiro: ' + c.nombre + (c.direccion ? ', ' + c.direccion : '') + (c.ciudad ? ', ' + c.ciudad : '') + '\n' +
    'Entrega: ' + p.envio.dir + (c.ciudad ? ', ' + c.ciudad : '') + (p.envio.ref ? ' (' + p.envio.ref + ')' : '') + '\n' +

function despachar(p) {
  const ce = E().cfg.envio || {};
  const recientes = LS.get('fork:cadetes:' + R.slug, []);
  let quien = recientes[0] || '', link = '';
  const md = modal('');

      '<div class="h2" style="margin-top:18px">¿Sin cadete? Pedí uno</div><p class="mu sm" style="margin-bottom:8px">Copiá los datos, abrí el servicio y pegalos. Después marcá acá quién lo lleva.</p><div class="row w">' +
      (ce.pyLink ? '<a class="bt sm" target="_blank" rel="noopener" data-d="abrir" data-s="PedidosYa Envíos" href="' + esc(ce.pyLink) + '">Abrir PedidosYa Envíos</a>' : '') +
      (ce.uberLink ? '<a class="bt sm" target="_blank" rel="noopener" data-d="abrir" data-s="Uber Envíos" href="' + esc(ce.uberLink) + '">Abrir Uber Envíos</a>' : '') + '</div>' +
      '<div class="h2" style="margin-top:18px">¿Quién lo lleva?</div><div class="chips">' +
      [...recientes, ...SERVICIOS].filter((x, i, a) => x && a.indexOf(x) === i).map((x) => '<button data-q="' + esc(x) + '" class="' + (x === quien ? 'on' : '') + '">' + esc(x) + '</button>').join('') + '</div>' +
      '<input class="in" style="margin-top:10px" id="dq" placeholder="Otro nombre" value="' + esc(quien) + '" maxlength="40">' +
      (SERVICIOS.indexOf(quien) >= 0 ? '<input class="in" style="margin-top:8px" id="dl" placeholder="Link de seguimiento (opcional, lo ve el cliente)" value="' + esc(link) + '">' : '') +
      '<button class="bt ok xl" style="width:100%;margin-top:14px" data-d="salir">🛵 Salió</button>';
  };
  md.addEventListener('input', (e) => { if (e.target.id === 'dq') quien = e.target.value; if (e.target.id === 'dl') link = e.target.value; });

      if (SERVICIOS.indexOf(quien.trim()) < 0) LS.set('fork:cadetes:' + R.slug, [quien.trim(), ...recientes.filter((x) => x !== quien.trim())].slice(0, 6));

function entregarEnvio(p, alTerminar) {
  if (p.pago.ok) { hacer({ o: 'estado', id: p.id, e: 'entregado' }, p.num + ' entregado').then(alTerminar).catch(() => {}); return; }

    '<div class="grid2"><button class="bt ok xl" data-c="1">Sí, cobrado</button><button class="bt xl" data-c="0">Entregado sin cobrar</button></div>');
  md.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    if (b.dataset.c === '1') await hacer({ o: 'pago', id: p.id, m: p.pago.m === 'app' ? 'efectivo' : p.pago.m, ok: true });

    return '<div class="ped ' + (modo === 'mio' ? 'listo' : 'prep') + '"><div class="row w"><span class="nm n">' + esc(p.num) + '</span><span class="chip">' + esc(p.envio.zona) + '</span><span class="sp"></span>' +
      '<span class="mu sm n">' + (modo === 'mio' ? 'salió hace ' + minutos(t - p.envio.salio) : 'listo hace ' + minutos(t - p.listo)) + ' min</span></div>' +
      '<div style="font-size:1.25em;font-weight:800;margin-top:8px">' + esc(p.envio.dir) + '</div>' + (p.envio.ref ? '<div class="mu">' + esc(p.envio.ref) + '</div>' : '') +
      '<div class="b" style="margin-top:4px">' + esc(p.nombre || 'Cliente') + (p.tel ? ' · <span class="n">' + esc(p.tel) + '</span>' : '') + '</div>' +

      '<div class="row w" style="margin-top:10px"><a class="bt sm" target="_blank" rel="noopener" href="' + esc(mapaDe(p)) + '">🗺 Mapa</a>' +
      (p.tel ? '<a class="bt sm" href="tel:' + esc(String(p.tel).replace(/[^\d+]/g, '')) + '">📞 Llamar</a>' : '') +
      (tel ? '<a class="bt sm" target="_blank" rel="noopener" href="https://wa.me/' + tel + '?text=' + encodeURIComponent(msg) + '">💬 Avisar</a>' : '') +
      '<button class="bt sm gh" data-a="remito" data-id="' + p.id + '">🖨</button></div>' +
      '<div style="margin-top:10px">' + (modo === 'salir' ? '<button class="bt ac xl" style="width:100%" data-a="llevo" data-id="' + p.id + '">Me lo llevo</button>'
        : '<button class="bt ok xl" style="width:100%" data-a="entregado" data-id="' + p.id + '">Entregado</button>') + '</div></div>';
  },
  async click(e) {
    const y = e.target.closest('[data-yo]'); if (y) { this.yo = y.dataset.yo; LS.set('fork:yo-cadete:' + R.slug, this.yo); this.pintar(); return; }
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a, p = E().pedidos[el.dataset.id];
    if (a === 'cambiar') { this.yo = ''; LS.del('fork:yo-cadete:' + R.slug); this.pintar(); return; }
    if (!p) return;
    if (a === 'remito') imprimir(tqTicket(p));
    if (a === 'llevo') {
      await hacer({ o: 'salir', id: p.id, cadete: this.yo }, 'Buen viaje 🛵');
      const rec = LS.get('fork:cadetes:' + R.slug, []);
      LS.set('fork:cadetes:' + R.slug, [this.yo, ...rec.filter((x) => x !== this.yo)].slice(0, 6));
    }
    if (a === 'entregado') entregarEnvio(p);
  }
};

    this.pintar();
  },
  actualizar() { this.pintar(); },
  tic() { $$('[data-t0]').forEach((el) => { el.textContent = mmss(ahora() - Number(el.dataset.t0)); }); if (!this.tt || Date.now() - this.tt > 20000) { this.tt = Date.now(); this.pintar(); } },

    const st = E(), t = ahora();
    const ests = estaciones();
    if (this.est && ests.indexOf(this.est) < 0) this.est = '';
    $('#ck-est').innerHTML = ['', ...ests].map((x) => '<button data-a="est" data-v="' + esc(x) + '" class="' + (this.est === x ? 'on' : '') + '">' + (x ? esc(x) : 'Todo') + '</button>').join('');
    const ps = H.activos(st).filter((p) => p.estado === 'prep');
    const ids = ps.map((p) => p.id);
    const nuevos = this.conocidos ? ps.filter((p) => this.conocidos.indexOf(p.id) < 0) : [];
    if (nuevos.length) { sonar('nuevo'); if (impLocal().comanda) imprimir(nuevos.map(tqComanda)); }
    this.conocidos = ids;
    // Qué hay que producir ahora, sumado entre todas las comandas
    const prod = H.produccion(st, this.est);
    $('#ck-prod').innerHTML = prod.length ? '<div class="prodbar"><button class="g tg" data-a="verprod" title="Mostrar u ocultar">' + (this.verProd ? '▾' : '▸') + ' A producir</button>' +
      (this.verProd ? prod.map((g) => '<div class="g"><b>' + esc(g.g) + '</b>' + g.items.map((x) => '<span><i class="n">' + x.c + '</i>' + esc(x.n) + '</span>').join('') + '</div>').join('') : '') + '</div>' : '';
    const vis = ps.filter((p) => !this.est || p.items.some((it) => it.pasos.some((s) => s.est === this.est && s.e !== 'l')));
    $('#ck').innerHTML = vis.length ? vis.map((p) => {
      const t0 = p.prep || p.creado;
      const total = p.items.reduce((m, it) => Math.max(m, it.pasos.reduce((s, x) => s + x.min, 0)), 0) + (st.cfg.demora || 0) / 2;
      const r = (t - t0) / 60000 / Math.max(1, total);
      const color = r < 0.7 ? 'verde' : r < 1 ? 'amar' : 'rojo';
      return '<div class="tk ' + color + '"><header><span class="nm n">' + esc(p.num) + '</span><span class="chip">' + esc(origenTxt(p)) + '</span><span class="t n" data-t0="' + t0 + '">' + mmss(t - t0) + '</span></header>' +
        (p.nota ? '<div style="padding:8px 14px 0;color:var(--wa);font-weight:700">📝 ' + esc(p.nota) + '</div>' : '') +
        '<div class="its">' + p.items.map((it, i) => {
          if (this.est && !it.pasos.some((s) => s.est === this.est)) return '';
          return '<div class="ii"><span class="q n">' + it.q + '×</span><b>' + esc(it.n) + '</b>' + (it.ops || []).map((o) => '<span class="op"><em>' + esc(o.g) + '</em> ' + esc(o.v) + '</span>').join('') +
            (it.nota ? '<span class="nota">⚠ ' + esc(it.nota) + '</span>' : '') +
            '<div class="ps">' + it.pasos.map((s, j) => '<button data-a="paso" data-id="' + p.id + '" data-i="' + i + '" data-j="' + j + '" class="' + (s.e === 'p' ? '' : s.e) + (this.est && s.est !== this.est ? ' off' : '') + '">' +
              esc(s.n) + (s.e === 'h' ? ' · <span class="n" data-t0="' + s.t + '">' + mmss(t - s.t) + '</span>' : s.e === 'p' ? ' <span class="mu">' + s.min + '\'</span>' : '') + '</button>').join('') + '</div></div>';
        }).join('') + '</div>' +
        '<footer><button class="bt sm ok" style="flex:1" data-a="todo" data-id="' + p.id + '">Todo listo</button><button class="bt sm gh" data-a="impComanda" data-id="' + p.id + '" title="Imprimir comanda">🖨</button></footer></div>';
    }).join('') : '<div class="vacio" style="grid-column:1/-1">' + esc(T('cocinaVacia')) + '</div>';
    const listos = lista(st.pedidos).filter((p) => p.estado === 'listo').sort((a, b) => b.listo - a.listo).slice(0, 8);
    $('#ck-list').innerHTML = '<div class="row w"><b class="sm">Listos recientes</b>' + (listos.length ? listos.map((p) => '<span class="chip ok">' + esc(p.num) + ' <button data-a="deshacer" data-id="' + p.id + '" class="xs" style="text-decoration:underline">deshacer</button></span>').join('') : '<span class="mu sm">Ninguno todavía</span>') + '</div>';
  },
  agotados() {
    const md = modal('', 'ancho');
    const pintar = () => {
      const its = itemsMenu();
      // Grupos de opciones sin repetir: "Sabores" aparece una sola vez aunque esté en la docena y en la media
      const grupos = [], vistos = {};
      its.forEach((i) => (i.opciones || []).forEach((g) => {
        if (g.t === 'varios' && !g.items.some((x) => x.precio)) return;
        const k = g.prod || g.n;
        if (vistos[k]) return;
        vistos[k] = 1; grupos.push({ k, p: i.id, g });
      }));
      md.firstChild.innerHTML = '<div class="row"><div class="tit sp">¿Qué se terminó?</div><button class="bt sm gh" data-cerrar>Listo</button></div>' +
        '<p class="mu sm" style="margin:6px 0 4px">Tocá para marcar o desmarcar. Se ve al instante en el menú, la ventanilla y la caja.</p>' +
        E().menu.cats.map((c) => {
          const de = its.filter((i) => i.cat === c); if (!de.length) return '';
          return '<div class="h2" style="margin-top:14px">' + esc(c) + '</div><div class="chips">' + de.map((i) =>
            '<button data-ag="' + esc(i.id) + '" class="' + (i.agotado ? 'off' : 'on') + '">' + esc(i.emoji) + ' ' + esc(i.nombre) + '</button>').join('') + '</div>';
        }).join('') +
        grupos.map((x) => '<div class="h2" style="margin-top:14px">' + esc(x.k) + '</div><div class="chips">' + x.g.items.map((o) =>
          '<button data-ag="' + esc(x.p) + '" data-g="' + esc(x.g.id) + '" data-n="' + esc(o.n) + '" class="' + (o.agotado ? 'off' : 'on') + '">' + esc(o.n) + '</button>').join('') + '</div>').join('');
    };
    md.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-ag]'); if (!b) return;
      const pr = E().menu.items[b.dataset.ag]; if (!pr) return;
      let actual = pr.agotado;
      if (b.dataset.g) { const g = pr.opciones.find((x) => x.id === b.dataset.g); actual = g.items.find((x) => x.n === b.dataset.n).agotado; }
      await hacer({ o: 'agotado', id: pr.id, g: b.dataset.g || '', n: b.dataset.n || '', v: !actual }, (b.dataset.n || pr.nombre) + (actual ? ' disponible' : ' agotado'));
      pintar();
    });
    pintar();
  },
  async click(e) {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a;
    if (a === 'est') { this.est = el.dataset.v; LS.set('fork:est:' + R.slug, this.est); this.pintar(); return; }
    if (a === 'verprod') { this.verProd = !this.verProd; LS.set('fork:verprod', this.verProd); this.pintar(); return; }
    if (a === 'agotados') { this.agotados(); return; }
    if (a === 'ajimp') { ajustesImpresion('cocina'); return; }
    const id = el.dataset.id, p = E().pedidos[id];
    if (!p) return;
    if (a === 'paso') {
      const i = +el.dataset.i, j = +el.dataset.j, s = p.items[i].pasos[j];
      const sig = { p: 'h', h: 'l', l: 'p' }[s.e];
      await hacer({ o: 'paso', id, i, j, e: sig });
    }
    if (a === 'todo') await hacer({ o: 'estado', id, e: 'listo' }, p.num + ' listo');
    if (a === 'deshacer') await hacer({ o: 'estado', id, e: 'prep' });
    if (a === 'impComanda') imprimir(tqComanda(p));
  }
};

      '<a class="bt sm gh" target="_blank" href="' + esc(url(R.slug, 'menu', 'mesa=' + m.id)) + '">Menú QR</a></div>';
  },
  arrastre() {
    const pl = $('#ms-plano'); if (!pl) return;
    let mv = null;
    pl.addEventListener('pointerdown', (e) => {
      const el = e.target.closest('[data-mesa]'); if (!el || !this.editar) return;
      const r = pl.getBoundingClientRect(), er = el.getBoundingClientRect();
      mv = { el, id: el.dataset.mesa, dx: e.clientX - er.left, dy: e.clientY - er.top, r, x0: e.clientX, y0: e.clientY };
      this.moviendo = true; el.setPointerCapture(e.pointerId);
    });
    pl.addEventListener('pointermove', (e) => {
      if (!mv) return;
      const x = Math.max(0, Math.min(94, (e.clientX - mv.r.left - mv.dx) / mv.r.width * 100));
      const y = Math.max(0, Math.min(90, (e.clientY - mv.r.top - mv.dy) / mv.r.height * 100));
      mv.el.style.left = x + '%'; mv.el.style.top = y + '%'; mv.x = x; mv.y = y;
    });
    const fin = () => {
      if (!mv) return;
      const m = mv; mv = null; this.moviendo = false;
      if (m.x != null) hacer({ o: 'mesa', id: m.id, v: { x: Math.round(m.x * 10) / 10, y: Math.round(m.y * 10) / 10 } }).catch(() => {});
      else { this.sel = m.id; this.pintar(); }
    };
    pl.addEventListener('pointerup', fin);
    pl.addEventListener('pointercancel', fin);
  },
  async click(e) {
    const ms = e.target.closest('[data-mesa]');
    if (ms && !this.editar) { this.sel = this.sel === ms.dataset.mesa ? '' : ms.dataset.mesa; this.pintar(); return; }
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a, m = E().mesas[this.sel];
    if (a === 'pausa') return;
    if (a === 'mtab') { this.tab = el.dataset.v; this.pintar(); return; }
    if (a === 'ajimp') { ajustesImpresion('caja'); return; }
    if (a === 'cuentaImp' && m) { imprimir(tqCuenta(m.id)); return; }
    if (a === 'editar') { this.editar = !this.editar; el.textContent = this.editar ? 'Terminar' : 'Editar plano'; this.pintar(); return; }
    if (a === 'mesaNueva') { this.sel = await hacer({ o: 'mesaNueva' }); return; }
    if (a === 'mesaBorrar' && m) { if (confirm('¿Borrar la mesa ' + m.n + '?')) { await hacer({ o: 'mesaBorrar', id: m.id }); this.sel = ''; this.pintar(); } return; }
    if (a === 'ocupar' && m) return hacer({ o: 'mesa', id: m.id, v: { estado: 'ocupada' } });
    if (a === 'liberar' && m) { if (!H.itemsDeMesa(E(), m.id).length || confirm('La mesa tiene pedidos sin cerrar. ¿Liberarla igual?')) return hacer({ o: 'mesa', id: m.id, v: { estado: 'libre' } }); return; }
    if (a === 'atendido' && m) return hacer({ o: 'atendido', mesa: m.id });
    if (a === 'cerrar' && m) return this.cobrar(m);
    if (a === 'pedirMesa' && m) return this.cargar('M', m.id);
    if (a === 'nuevoPed') return this.cargar('V');
    accionPedido(a, el);
  },
  cobrar(m) {
    const total = H.itemsDeMesa(E(), m.id).reduce((s, p) => s + p.total, 0);
    const md = modal('<div class="tit">Cobrar mesa ' + esc(m.n) + '</div><div class="big n" style="font-size:2.6em;font-weight:900;margin:10px 0">' + plata(total) + '</div><p class="mu sm" style="margin-bottom:12px">¿Cómo pagó?</p><div class="grid2">' +
      ['efectivo', 'alias', 'mp', 'tarjeta'].map((x) => '<button class="bt xl" data-m="' + x + '">' + MEDIO[x] + '</button>').join('') + '</div>');
    md.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      await hacer({ o: 'cerrarMesa', mesa: m.id, m: b.dataset.m }, 'Mesa ' + m.n + ' cerrada');
      md.cerrar();
    });
  },
  cargar(origen, mesa) {
    let org = origen;
    const pos = crearPOS(() => pintar());
    const ext = { app: 'PedidosYa', link: '', cadete: '' };
    const ce = E().cfg.envio || {};
    const env = { tel: '', zona: (ce.zonas && ce.zonas[0] && ce.zonas[0].n) || '', costo: 0, dir: '', ref: '' };
    const md = modal('<div></div>', 'ancho');
    const pintar = () => {
      const zonas = ce.zonas || [];
      md.firstChild.innerHTML = '<div class="row w" style="margin-bottom:12px"><div class="tit sp">' + (org === 'M' ? 'Pedido para ' + esc(nombreMesa(mesa)) : 'Pedido nuevo') + '</div>' +
        (org === 'M' ? '' : '<div class="tabs"><button data-o="V" class="' + (org === 'V' ? 'on' : '') + '">Para llevar</button>' +
          (ce.activo ? '<button data-o="D" class="' + (org === 'D' ? 'on' : '') + '">🛵 Envío</button>' : '') +
          '<button data-o="E" class="' + (org === 'E' ? 'on' : '') + '">PedidosYa / Uber Eats</button></div>') +
        '<button class="bt sm gh" data-cerrar>Cerrar</button></div>' +
        '<div class="grid2"><div>' + pos.htmlProductos() + '</div><div class="col">' +
        (org === 'E' ? '<div class="pn col"><div class="row w">' + ['PedidosYa', 'Uber Eats', 'Rappi', 'Otra'].map((x) => '<button class="bt sm ' + (ext.app === x ? 'ac' : 'gh') + '" data-app="' + x + '">' + x + '</button>').join('') + '</div>' +
          '<input class="in" data-ext="link" placeholder="Link de seguimiento (opcional)" value="' + esc(ext.link) + '"><input class="in" data-ext="cadete" placeholder="Teléfono del cadete (opcional)" value="' + esc(ext.cadete) + '"></div>' : '') +
        (org === 'D' ? '<div class="pn col"><div class="b">Datos del envío</div>' +
          '<input class="in" data-env="dir" placeholder="Dirección" value="' + esc(env.dir) + '" maxlength="120">' +
          '<input class="in" data-env="ref" placeholder="Referencia: piso, timbre, entre calles" value="' + esc(env.ref) + '" maxlength="120">' +
          '<input class="in" data-env="tel" placeholder="Teléfono" inputmode="tel" value="' + esc(env.tel) + '" maxlength="30">' +
          '<div class="row w"><select class="in" data-env="zona" style="flex:1">' + zonas.map((z) => '<option value="' + esc(z.n) + '"' + (z.n === env.zona ? ' selected' : '') + '>' + esc(z.n) + ' · ' + plata(z.costo) + '</option>').join('') +
          '<option value=""' + (!env.zona ? ' selected' : '') + '>Otra zona</option></select>' +
          (!env.zona ? '<input class="in n" type="number" min="0" data-env="costo" placeholder="Costo" value="' + (env.costo || '') + '" style="width:120px">' : '') + '</div></div>' : '') +
        '<div>' + pos.htmlCarrito(org === 'V' || org === 'D') + '</div>' +
        (org === 'D' && pos.items.length ? '<div class="row"><span class="mu">Con envío</span><span class="sp"></span><b class="n">' + plata(pos.total() + this.costoEnvio(env)) + '</b></div>' : '') +
        '<button class="bt ok xl" id="mp-ok"' + (pos.items.length ? '' : ' disabled') + '>Enviar a cocina</button></div></div>';
    };
    md.addEventListener('click', async (e) => {
      const o = e.target.closest('[data-o]'); if (o) { org = o.dataset.o; pintar(); return; }
      const ap = e.target.closest('[data-app]'); if (ap) { ext.app = ap.dataset.app; pintar(); return; }
      const el = e.target.closest('[data-a]'); if (el) { pos.click(el.dataset.a, el); return; }
      if (e.target.id === 'mp-ok') {
        const v = { origen: org, items: pos.items, nombre: pos.nombre };
        if (org === 'M') { v.mesa = mesa; v.pago = { m: 'mesa', ok: false }; }
        else if (org === 'E') { v.ext = ext; v.pago = { m: 'app', ok: true }; }
        else v.pago = { m: pos.medio, ok: pos.pagado };
        if (org === 'D') {
          if (!env.dir.trim()) return toast('Falta la dirección', 'bad');
          if (!env.tel.trim()) return toast('Falta el teléfono para el cadete', 'bad');
          v.tel = env.tel; v.envio = { zona: env.zona, costo: env.costo, dir: env.dir, ref: env.ref };
        }
        e.target.disabled = true;
        try { const p = await hacer({ o: 'pedido', v }); toast(p.num + ' enviado a cocina', 'ok'); md.cerrar(); imprimirAlMandar(p); }
        catch (er) { e.target.disabled = false; }
      }
    });
    md.addEventListener('input', (e) => {
      const t = e.target;
      if (t.dataset.ext) ext[t.dataset.ext] = t.value;
      if (t.dataset.env) { env[t.dataset.env] = t.dataset.env === 'costo' ? Number(t.value) || 0 : t.value; }
      pos.input(t);
    });
    md.addEventListener('change', (e) => { pos.input(e.target); if (e.target.dataset.env === 'zona') pintar(); });
    pintar();
  },
  costoEnvio(env) {
    const z = ((E().cfg.envio || {}).zonas || []).find((x) => x.n === env.zona);
    return z ? z.costo : (env.costo || 0);
  }
};
