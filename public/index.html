    return '<div class="pn col"><div class="h2">Qué usa tu local</div>' +
      [['mesas', 'Mesas y menú QR en las mesas'], ['pared', 'Pantalla de la pared (TV)'], ['ventana', 'Ventanilla de takeaway con dos pantallas'], ['online', 'Pedidos online desde la landing']].map((m) => '<label class="sw"><input type="checkbox" data-mod="' + m[0] + '"' + (mo[m[0]] ? ' checked' : '') + '> ' + m[1] + '</label>').join('') +
      '<label class="sw"><input type="checkbox" data-k2="paredInicial"' + (E().cfg.paredInicial ? ' checked' : '') + '> Mostrar la inicial del nombre en la pared (nunca el nombre completo)</label>' +
      '<p class="mu sm">Las mesas se acomodan desde el Mostrador con "Editar plano".</p></div>';
  },
  t_pantallas() {
    const s = R.slug;
    const pts = [['Página de pedidos', 'menu', 0], ['Pared (TV)', 'pared', 0], ['Cocina', 'cocina', 1], ['Mostrador', 'mostrador', 1], ['Ventana · Operador', 'caja/v1', 1], ['Ventana · Cliente', 'ventana/v1', 1]].concat((E().cfg.envio || {}).activo ? [['Reparto', 'reparto', 1]] : []);
    return '<div class="pn col">' + (SYNC.local ? '<div class="chip wa">Este local funciona sólo en este navegador. Para usarlo en varios dispositivos, publicá Fork con el Worker y creá el local desde ahí.</div>' :
      '<div class="h2">PIN del personal</div><div class="copiar"><code class="n" style="font-size:1.5em;letter-spacing:.2em">' + esc(SYNC.pin || '') + '</code><button class="bt sm" data-c="' + esc(SYNC.pin || '') + '">Copiar</button></div>' +
      '<p class="mu sm">Se pide una vez en cada tablet o pantalla del personal. El link de administrador no lo compartas.</p>') +
      '<div class="h2" style="margin-top:10px">Links de cada pantalla</div>' +
      pts.map((p) => '<div class="copiar"><span class="b" style="min-width:150px">' + p[0] + (p[2] ? ' 🔒' : '') + '</span><code class="sm">' + esc(url(s, p[1])) + '</code><button class="bt sm" data-c="' + esc(url(s, p[1])) + '">Copiar</button><button class="bt sm" data-a="qrp" data-v="' + esc(url(s, p[1])) + '" data-n="' + esc(p[0]) + '">QR</button><a class="bt sm gh" target="_blank" href="' + esc(url(s, p[1])) + '">Abrir</a></div>').join('') +
      '<button class="bt ac" data-a="qrs" style="margin-top:12px">Ver e imprimir los QR</button></div>';
  },
  t_respaldo() {
    return '<div class="pn col"><div class="h2">Respaldo</div><p class="mu sm">Descargá un archivo con la configuración, el menú y las mesas. Sirve para tener una copia o para pasar el local a otro lado.</p>' +
      '<div class="row w"><button class="bt" data-a="exportar">Descargar respaldo</button><label class="bt gh">Importar respaldo<input type="file" accept=".json,application/json" data-a="importar" hidden></label></div>' +
      '<div class="h2" style="margin-top:14px">Pedidos</div><p class="mu sm">Los pedidos entregados se archivan solos al día siguiente. Si querés, borralos ahora.</p><button class="bt gh" data-a="limpiar">Borrar pedidos entregados y cancelados</button>' +
      (esDemo(SYNC.slug) && TIENDA() ? '<div class="h2" style="margin-top:14px">Demo</div><button class="bt bad" data-a="reset">Reiniciar la demo</button>' : '') + '</div>';
  },
  async guardar(v, msg) { await hacer({ o: 'cfg', v }, msg || 'Guardado'); },
  leerCfg() {
    const v = {};
    $$('[data-k]', this.root).forEach((el) => { v[el.dataset.k] = el.value; });
    const medios = {}; $$('[data-medio]', this.root).forEach((el) => { medios[el.dataset.medio] = el.checked; });
    if (Object.keys(medios).length) v.medios = medios;
    return v;
  },
  async cambio(e, enVivo) {
    const el = e.target;
    if (el.dataset.ev) { const k = el.dataset.ev; this.envio[k] = k === 'activo' ? el.checked : (k === 'minimo' || k === 'extra') ? Number(el.value) || 0 : el.value; return; }
    if (el.dataset.z != null) { const z = this.envio.zonas[+el.dataset.z]; z[el.dataset.zf] = el.dataset.zf === 'costo' ? Number(el.value) || 0 : el.value; return; }
    if (el.dataset.mod && !enVivo) { await this.guardar({ modulos: { [el.dataset.mod]: el.checked } }); return; }
    if (el.dataset.k2 && !enVivo) { await this.guardar({ [el.dataset.k2]: el.checked }); return; }
    if (el.dataset.cat != null) { this.menu.cats[+el.dataset.cat] = el.value; return; }
    if (el.dataset.it) {
      const it = this.menu.items[el.dataset.it]; if (!it) return;
      const f = el.dataset.f;
      it[f] = f === 'agotado' ? el.checked : f === 'precio' ? Number(el.value) : el.value;
      if (f === 'agotado' && !enVivo) {
        const real = H.clon(E().menu);
        if (real.items[it.id]) { real.items[it.id].agotado = el.checked; await hacer({ o: 'menu', v: real }, el.checked ? it.nombre + ' agotado' : it.nombre + ' disponible'); }
      }
      return;
    }
    if (el.dataset.a === 'importar' && !enVivo && el.files[0]) {
      try {
        const j = JSON.parse(await el.files[0].text());
        if (confirm('Esto reemplaza la configuración, el menú y las mesas. ¿Seguir?')) { await hacer({ o: 'importar', v: j }, 'Respaldo importado'); this.menu = H.clon(E().menu); this.pintar(); }
      } catch (er) { toast('El archivo no es válido', 'bad'); }
    }
  },
  async click(e) {
    const cp = e.target.closest('[data-c]'); if (cp) { copiar(cp.dataset.c); return; }
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a;
    if (a === 'tab') { this.tab = el.dataset.v; this.pintar(); return; }
    if (a === 'guardarCfg') { await this.guardar(this.leerCfg()); colorLocal(); return; }
    if (a === 'guardarHor') {
      const h = [[], [], [], [], [], [], []]; let mal = '';
      $$('[data-dia]', this.root).forEach((inp) => {
        const d = +inp.dataset.dia;
        inp.value.split(',').map((x) => x.trim()).filter(Boolean).forEach((t) => {
          const m = /^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})$/.exec(t);
          if (m) h[d].push([m[1].padStart(5, '0'), m[2].padStart(5, '0')]); else mal = DIAS[d];
        });
      });
      if (mal) return toast('Revisá el horario del ' + mal.toLowerCase() + ': usá el formato 19:30-00:30', 'bad');
      const v = this.leerCfg(); v.horarios = h;
      await this.guardar(v); return;
    }
    if (a === 'zonaNueva') { this.envio.zonas.push({ n: '', costo: 0 }); this.pintar(); return; }
    if (a === 'zonaBorrar') { this.envio.zonas.splice(+el.dataset.v, 1); this.pintar(); return; }
    if (a === 'guardarEnvio') {
      if (this.envio.activo && !this.envio.zonas.some((z) => z.n.trim())) return toast('Cargá al menos una zona', 'bad');
      await this.guardar({ envio: this.envio }); this.envio = Object.assign(this.envio, H.clon(E().cfg.envio)); this.pintar(); return;
    }
    if (a === 'guardarImp') { await this.guardar({ impresion: { ancho: $('[data-imp=ancho]', this.root).value, pie: $('[data-imp=pie]', this.root).value } }); return; }
    if (a === 'pruebaImp') { imprimir(tqPrueba()); return; }
    if (a === 'catNueva') { this.menu.cats.push('Nueva categoría'); this.pintar(); return; }
    if (a === 'catBorrar') {
      const c = this.menu.cats[+el.dataset.v];
      if (lista(this.menu.items).some((i) => i.cat === c)) return toast('Primero mové los productos de "' + c + '" a otra categoría', 'bad');
      this.menu.cats.splice(+el.dataset.v, 1); this.pintar(); return;
    }
    if (a === 'itNuevo') {
      const id = 'p' + H.rid(5);
      this.menu.items[id] = { id, cat: this.menu.cats[0] || '', nombre: 'Producto nuevo', desc: '', precio: 0, emoji: '🍽️', foto: '', agotado: false, orden: 999, pasos: [{ n: 'Preparar', min: 5, est: '' }] };
      this.pintar(); this.editarItem(id); return;
    }
    if (a === 'menuEjemplo') {
      const t = TIENDA() || lista(H.tiendas)[0];
      this.menu = H.clon(H.plantilla(t).menu); this.pintar(); toast('Revisalo y tocá "Guardar menú"'); return;
    }
    if (a === 'itEditar') { this.editarItem(el.dataset.v); return; }
    if (a === 'guardarMenu') {
      // Las categorías renombradas arrastran a sus productos
      const viejas = E().menu.cats;
      lista(this.menu.items).forEach((i) => { const k = viejas.indexOf(i.cat); if (this.menu.cats.indexOf(i.cat) < 0 && k >= 0 && this.menu.cats[k]) i.cat = this.menu.cats[k]; });
      await hacer({ o: 'menu', v: this.menu }, 'Menú guardado');
      this.menu = H.clon(E().menu); this.pintar(); return;
    }
    if (a === 'qrs') { this.qrs(); return; }
    if (a === 'qrp') {
      modal('<div class="tit">' + esc(el.dataset.n) + '</div><p class="mu" style="margin:6px 0 14px">Escaneá este código con el dispositivo donde va esta pantalla.</p><div style="background:#fff;padding:16px;border-radius:14px;max-width:300px;margin:0 auto">' + qrSVG(el.dataset.v) + '</div><button class="bt ac" style="width:100%;margin-top:14px" data-cerrar>Listo</button>');
      return;
    }
    if (a === 'exportar') {
      const st = E();
      const b = new Blob([JSON.stringify({ fork: H.version, cfg: st.cfg, menu: st.menu, mesas: st.mesas }, null, 2)], { type: 'application/json' });
      const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = 'fork-' + R.slug + '.json'; l.click(); URL.revokeObjectURL(l.href); return;
    }
    if (a === 'limpiar') { if (confirm('¿Borrar los pedidos entregados y cancelados?')) await hacer({ o: 'limpiar' }, 'Listo'); return; }
    if (a === 'reset') { if (confirm('¿Volver la demo al estado inicial?')) { LS.set('fork:st:' + SYNC.slug, H.demo(TIENDA())); SYNC.releer(); if (SYNC.bc) SYNC.bc.postMessage(1); this.menu = H.clon(E().menu); this.pintar(); toast('Demo reiniciada', 'ok'); } }
  },
  editarItem(id) {
    const it = this.menu.items[id];
    it.opciones = it.opciones || [];
    const ests = estaciones();
    const TIPOS = { uno: 'Elegir una', varios: 'Elegir varias', surtido: 'Repartir una cantidad' };
    const pintar = () => '<div class="row"><div class="tit sp">' + esc(it.emoji) + ' ' + esc(it.nombre) + '</div><button class="bt sm bad" data-x="borrar">Borrar</button></div>' +
      '<label class="f" style="margin-top:12px">Descripción<textarea class="in" data-f="desc" maxlength="200">' + esc(it.desc) + '</textarea></label>' +
      '<label class="f" style="margin-top:10px">Foto (link a una imagen, opcional)<input class="in" data-f="foto" value="' + esc(it.foto) + '" placeholder="https://…"></label>' +
      '<div class="h2" style="margin-top:16px">Pasos en la cocina</div><p class="mu sm" style="margin-bottom:8px">Cada paso aparece como un botón en la comanda. La estación sirve para filtrar la vista de cocina (plancha, horno, barra fría…).</p>' +
      '<div class="pasos">' + it.pasos.map((s, j) => '<div class="row"><input class="in" data-p="' + j + '" data-pf="n" value="' + esc(s.n) + '" placeholder="Paso"><input class="in n" type="number" min="0" style="width:90px" data-p="' + j + '" data-pf="min" value="' + s.min + '" title="Minutos">' +
        '<input class="in" list="ests" style="width:150px" data-p="' + j + '" data-pf="est" value="' + esc(s.est) + '" placeholder="Estación"><button class="bt sm gh" data-x="pBorrar" data-v="' + j + '">✕</button></div>').join('') + '</div>' +
      '<datalist id="ests">' + ests.map((x) => '<option value="' + esc(x) + '">').join('') + '</datalist>' +
      '<button class="bt sm" data-x="pNuevo">+ Paso</button>' +
      '<div class="h2" style="margin-top:20px">Opciones</div><p class="mu sm" style="margin-bottom:8px">Sabores, extras, salsas, punto de cocción, rolls a elección. Una opción por renglón; si suma precio, poné <b>+900</b> al final.</p>' +
      it.opciones.map((g, k) => '<div class="pn" style="padding:12px;margin-bottom:10px"><div class="row w">' +
        '<input class="in" style="flex:1;min-width:140px" data-og="' + k + '" data-of="n" value="' + esc(g.n) + '" placeholder="Nombre del grupo">' +
        '<select class="in" style="width:auto" data-og="' + k + '" data-of="t">' + Object.keys(TIPOS).map((t) => '<option value="' + t + '"' + (g.t === t ? ' selected' : '') + '>' + TIPOS[t] + '</option>').join('') + '</select>' +
        (g.t === 'surtido' ? '<label class="f" style="flex-direction:row;align-items:center">Cantidad <input class="in n" type="number" min="1" style="width:80px" data-og="' + k + '" data-of="total" value="' + (g.total || 12) + '"></label>' : '') +
        (g.t === 'varios' ? '<label class="f" style="flex-direction:row;align-items:center">Tope <input class="in n" type="number" min="0" style="width:70px" data-og="' + k + '" data-of="max" value="' + (g.max || 0) + '" title="0 es sin tope"></label>' : '') +
        (g.t !== 'surtido' ? '<label class="sw sm"><input type="checkbox" data-og="' + k + '" data-of="req"' + (g.req ? ' checked' : '') + '> Obligatorio</label>' : '') +
        '<button class="bt sm gh" data-x="oBorrar" data-v="' + k + '">✕</button></div>' +
        '<textarea class="in" style="margin-top:8px;min-height:90px" data-og="' + k + '" data-of="items" placeholder="Una opción por renglón">' + esc(g.items.map((x) => x.n + (x.precio ? ' +' + x.precio : '')).join('\n')) + '</textarea>' +
        '<label class="f" style="margin-top:8px">Agrupar en "A producir" de la cocina como (opcional)<input class="in" data-og="' + k + '" data-of="prod" value="' + esc(g.prod || '') + '" placeholder="Ej: Sabores"></label></div>').join('') +
      '<button class="bt sm" data-x="oNuevo">+ Grupo de opciones</button>' +
      '<button class="bt ac" style="width:100%;margin-top:16px" data-cerrar>Listo</button><p class="mu xs" style="margin-top:8px;text-align:center">Acordate de tocar "Guardar menú" al terminar.</p>';
    const md = modal(pintar());
    md.alCerrar = () => this.pintar();
    const leerItems = (g, txt) => {
      const prev = {}; g.items.forEach((x) => { prev[x.n] = x; });
      g.items = txt.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
        const m = /^(.*?)\s*\+\s*\$?\s*([\d.]+)\s*$/.exec(l);
        const n = (m ? m[1] : l).trim(), precio = m ? Number(m[2].replace(/\./g, '')) : 0;
        return { n, precio, agotado: prev[n] ? !!prev[n].agotado : false };
      });
    };
    const cambio = (e, enVivo) => {
      const t = e.target;
      if (t.dataset.f) it[t.dataset.f] = t.value;
      if (t.dataset.p != null) it.pasos[+t.dataset.p][t.dataset.pf] = t.dataset.pf === 'min' ? Number(t.value) : t.value;
      if (t.dataset.og != null) {
        const g = it.opciones[+t.dataset.og], f = t.dataset.of;
        if (f === 'items') leerItems(g, t.value);
        else if (f === 'req') g.req = t.checked;
        else if (f === 'total' || f === 'max') g[f] = Number(t.value);
        else g[f] = t.value;
        if (f === 't' && !enVivo) md.firstChild.innerHTML = pintar();
      }
    };
    md.addEventListener('input', (e) => cambio(e, true));
    md.addEventListener('change', (e) => cambio(e, false));
    md.addEventListener('click', (e) => {
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'pNuevo') it.pasos.push({ n: '', min: 2, est: '' });
      if (x.dataset.x === 'pBorrar') it.pasos.splice(+x.dataset.v, 1);
      if (x.dataset.x === 'oNuevo') it.opciones.push({ id: 'g' + H.rid(4), n: 'Opciones', t: 'varios', req: false, items: [] });
      if (x.dataset.x === 'oBorrar') it.opciones.splice(+x.dataset.v, 1);
      if (x.dataset.x === 'borrar') { if (!confirm('¿Borrar ' + it.nombre + ' del menú?')) return; delete this.menu.items[id]; md.cerrar(); return; }
      md.firstChild.innerHTML = pintar();
    });
  },
  qrs() {
    const st = E(), s = R.slug;
    const tarjetas = [['Menú y pedidos', url(s), 'Escaneá para pedir y retirar']];
    if (st.cfg.modulos.mesas) lista(st.mesas).sort((a, b) => a.n.localeCompare(b.n, 'es', { numeric: true })).forEach((m) => tarjetas.push(['Mesa ' + m.n, url(s, 'menu', 'mesa=' + m.id), 'Escaneá para ver el menú, pedir o llamar al mozo']));
    const md = modal('<div class="imprimir"><div class="row no-print" style="margin-bottom:14px"><div class="tit sp">Códigos QR</div><button class="bt ac" onclick="print()">Imprimir</button><button class="bt gh" data-cerrar>Cerrar</button></div>' +
      '<div class="qrs">' + tarjetas.map((t) => '<div class="q"><div style="font-weight:900;font-size:1.3em">' + esc(st.cfg.emoji + ' ' + st.cfg.nombre) + '</div><div style="font-weight:800;margin:4px 0 8px">' + esc(t[0]) + '</div>' + qrSVG(t[1]) + '<div style="font-size:.85em;margin-top:6px">' + esc(t[2]) + '</div></div>').join('') + '</div></div>', 'ancho');
    return md;
  }
};

/* ---------- Arranque ---------- */
navegar();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol) && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
